<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard | English Course</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#172033;--muted:#687386;--line:#e2e7ef;--blue:#405fc4;--green:#13845c;--red:#c33e49}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 system-ui,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}.btn{background:var(--blue);color:#fff;padding:10px 15px;border-radius:10px;border:0;cursor:pointer;font:inherit}.alt{background:#e9edf7;color:var(--ink)}.muted{color:var(--muted);font-size:13px}.stats,.links{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#f2f5fb;border-radius:10px;padding:12px;min-width:130px}.stat b{display:block;font-size:23px}.attempt{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}.good{color:var(--green)}.bad,.error{color:var(--red)}.answer{border-top:1px solid var(--line);padding:10px 0}.paragraph{white-space:pre-wrap;background:#f7f8fb;padding:12px;border-radius:9px}input,textarea{font:inherit;padding:11px;border:1px solid var(--line);border-radius:9px;max-width:100%}input[type=email],input[type=password]{width:100%;margin:6px 0 12px}.hidden{display:none!important}@media(max-width:600px){.wrap{padding:10px}.card{padding:14px}}</style></head><body><main class="wrap">
<header><div class="muted">ENGLISH COURSE · PRIVATE TEACHER AREA</div><h1>لوحة المدرّسة</h1><p class="muted">عرض ومتابعة نتائج الطالبات.</p></header>
<div id="dashboard"><section class="card"><div class="links"><a class="btn" href="lecture1.html#first-class-session">المحاضرة الأولى</a><a class="btn alt" href="index.html">امتحان الطالبات</a><a class="btn alt" href="lecture1.html">100 كلمة B2 + 50 Expressions</a><button class="btn alt" onclick="loadAttempts()">تحديث النتائج</button></div></section>
<section class="card"><h2>نتائج الطلاب</h2><input id="studentSearch" type="search" placeholder="ابحث باسم الطالب..." oninput="renderReports()" style="width:100%;margin:8px 0 14px"><div class="stats" id="stats"></div><p id="status" class="muted"></p><div id="reports"></div></section>
<section class="card"><h2>تقييمات المدرّس</h2><p class="muted">كل تقييم تكتبه هنا يُحفظ في Supabase ويظهر بعد فتح اللوحة من أي جهاز.</p><label>اسم الطالب</label><input id="assessmentStudent" type="text" maxlength="120" placeholder="اكتب اسم الطالب" style="width:100%;margin:6px 0 12px"><label>نوع التقييم</label><input id="assessmentType" type="text" maxlength="80" value="Speaking assessment" placeholder="Speaking / Writing / General" style="width:100%;margin:6px 0 12px"><label>التقييم والملاحظات</label><textarea id="assessmentText" rows="5" maxlength="10000" style="width:100%" placeholder="اكتب أي تقييم أو ملاحظات تخص الطالب..."></textarea><p><button class="btn" onclick="saveAssessment()">حفظ التقييم في قاعدة البيانات</button> <button class="btn alt" onclick="loadAssessments()">تحديث التقييمات</button></p><p id="assessmentStatus" class="muted"></p><div id="assessments"></div></section></div>
</main><script>
const URL='https://ruliophlnvsexzjekdbs.supabase.co',KEY='sb_publishable_8un51zcumxHLX_M8gRqziQ_YxhgXnSC';
const db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let allAttempts=[];async function loadAttempts(){$('status').textContent='جارٍ تحميل النتائج...';const {data,error}=await db.from('english_test_attempts').select('*').order('created_at',{ascending:false});if(error){$('status').textContent='تعذر تحميل النتائج: '+error.message;return}allAttempts=data||[];$('stats').innerHTML='<div class="stat"><b>'+allAttempts.length+'</b>محاولة</div><div class="stat"><b>'+new Set(allAttempts.map(x=>x.student_name)).size+'</b>طالب</div><div class="stat"><b>'+(allAttempts.length?Math.round(allAttempts.reduce((n,x)=>n+x.total_score,0)/allAttempts.length/20*100)+'%':'—')+'</b>متوسط الدرجات</div>';$('status').textContent=allAttempts.length?'تم تحميل النتائج. ابحث باسم الطالب لعرض محاولاته.':'لا توجد نتائج حتى الآن.';renderReports()}function renderReports(){const term=($('studentSearch')?.value||'').trim().toLowerCase();const rows=allAttempts.filter(r=>String(r.student_name||'').toLowerCase().includes(term));$('reports').innerHTML=rows.map(r=>{const a=Array.isArray(r.answers)?r.answers:[];return '<article class="attempt"><details><summary><b>'+esc(r.student_name)+'</b> — '+r.total_score+'/20 · Grammar '+r.grammar_score+'/10 · Vocabulary '+r.vocabulary_score+'/10 · '+esc(r.test_date)+'</summary><p class="muted">'+esc(r.attempt_code)+' · '+esc(new Date(r.created_at).toLocaleString())+'</p><h4>فقرة الكتابة</h4><div class="paragraph">'+esc(r.paragraph_text||'لم تُكتب فقرة.')+'</div><h4>الإجابات</h4>'+a.map((x,i)=>'<div class="answer"><b>Q'+(i+1)+' · '+esc(x.section)+' · '+esc(x.level)+' · '+esc(x.topic||'')+'</b><p>'+esc(x.question)+'</p><div class="'+(x.isCorrect?'good':'bad')+'">إجابة الطالبة: '+esc(x.selectedLetter)+'. '+esc(x.selected)+' — '+(x.isCorrect?'صحيحة':'خطأ')+'</div><div class="good">الصحيح: '+esc(x.correctLetter)+'. '+esc(x.correct)+'</div><p>'+esc(x.explanation_ar||x.explanation||'')+'</p></div>').join('')+'</details></article>'}).join('')}
async function loadAssessments(){const box=$('assessments');$('assessmentStatus').textContent='جارٍ تحميل التقييمات...';const {data,error}=await db.from('english_teacher_assessments').select('*').order('created_at',{ascending:false});if(error){$('assessmentStatus').textContent='تعذر تحميل التقييمات: '+error.message;return}const rows=data||[];$('assessmentStatus').textContent='عدد التقييمات المحفوظة: '+rows.length;box.innerHTML=rows.map(x=>'<article class="attempt"><b>'+esc(x.student_name)+'</b><div class="muted">'+esc(x.assessment_type)+' · '+esc(new Date(x.created_at).toLocaleString())+'</div><div class="paragraph">'+esc(x.assessment_text)+'</div></article>').join('')||'<p class="muted">لا توجد تقييمات محفوظة حتى الآن.</p>'}
async function saveAssessment(){const student=$('assessmentStudent').value.trim(),type=$('assessmentType').value.trim()||'General assessment',assessment=$('assessmentText').value.trim();if(student.length<2){alert('اكتب اسم الطالب أولاً.');$('assessmentStudent').focus();return}if(!assessment){alert('اكتب التقييم قبل الحفظ.');$('assessmentText').focus();return}$('assessmentStatus').textContent='جارٍ حفظ التقييم...';const {error}=await db.from('english_teacher_assessments').insert({student_name:student,assessment_type:type,assessment_text:assessment});if(error){$('assessmentStatus').textContent='فشل الحفظ: '+error.message;return}$('assessmentText').value='';$('assessmentStatus').textContent='تم حفظ التقييم في Supabase بنجاح.';await loadAssessments()}
loadAttempts();loadAssessments();
</script></body></html>
